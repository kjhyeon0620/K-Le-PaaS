spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/klepaas}
    username: ${DB_USERNAME:klepaas}
    password: ${DB_PASSWORD}  # 기본값 없음
  # 스키마는 Flyway(db/migration)가 관리하고 Hibernate는 검증만 한다.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    klepaas.backend: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.springframework.web: INFO

app:
  base-url: ${APP_BASE_URL:http://localhost:3000/console}
  version: 0.0.1-SNAPSHOT

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000    # 1시간
  refresh-token-expiry: 604800000 # 7일

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:3000/console/auth/callback}
  app:
    app-id: ${GITHUB_APP_ID}
    private-key: ${GITHUB_APP_PRIVATE_KEY}
    app-slug: ${GITHUB_APP_SLUG}
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:}
  actions:
    oidc:
      # GitHub Actions OIDC 배포 인증 (#65). 워크플로가 요청하는 audience와 같아야 한다
      audience: ${GITHUB_ACTIONS_OIDC_AUDIENCE:k-le-paas}
      allowed-refs: ${GITHUB_ACTIONS_OIDC_ALLOWED_REFS:refs/heads/main}

cloud:
  ncp:
    credentials:
      access-key: ${NCP_ACCESS_KEY}
      secret-key: ${NCP_SECRET_KEY}
    region: ap-northeast-2
    storage:
      endpoint: https://kr.object.ncloudstorage.com
      bucket: ${NCP_STORAGE_BUCKET}
    container-registry:
      endpoint: ${NCR_ENDPOINT}

kubernetes:
  namespace: ${K8S_NAMESPACE:default}
  image-pull-secret: ${K8S_IMAGE_PULL_SECRET:ncp-cr}

kaniko:
  image: ${KANIKO_IMAGE:gcr.io/kaniko-project/executor:latest}

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL:}

deployment:
  domain:
    suffix: ${DEPLOYMENT_DOMAIN_SUFFIX:klepaas.io}
  pipeline:
    poll-initial-interval: 10000
    poll-max-interval: 60000
    build-timeout: 1800000

gemini:
  api:
    base-url: https://generativelanguage.googleapis.com
    key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
