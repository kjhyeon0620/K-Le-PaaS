spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/klepaas}
    username: ${DB_USERNAME:klepaas}
    password: ${DB_PASSWORD}  # 기본값 없음
  # 스키마는 Flyway(db/migration)가 관리하고 Hibernate는 검증만 한다.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    klepaas.backend: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.springframework.web: INFO

app:
  base-url: ${APP_BASE_URL:http://localhost:3000/console}
  version: 0.0.1-SNAPSHOT

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000    # 1시간
  refresh-token-expiry: 604800000 # 7일

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:3000/console/auth/callback}
  app:
    app-id: ${GITHUB_APP_ID}
    private-key: ${GITHUB_APP_PRIVATE_KEY}
    app-slug: ${GITHUB_APP_SLUG}
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:}
  actions:
    oidc:
      # GitHub Actions OIDC 배포 인증 (#65). 워크플로가 요청하는 audience와 같아야 한다
      audience: ${GITHUB_ACTIONS_OIDC_AUDIENCE:k-le-paas}
      allowed-refs: ${GITHUB_ACTIONS_OIDC_ALLOWED_REFS:refs/heads/main}

cloud:
  ncp:
    credentials:
      access-key: ${NCP_ACCESS_KEY}
      secret-key: ${NCP_SECRET_KEY}
    region: ap-northeast-2
    storage:
      endpoint: https://kr.object.ncloudstorage.com
      bucket: ${NCP_STORAGE_BUCKET}
    container-registry:
      endpoint: ${NCR_ENDPOINT}

kubernetes:
  namespace: ${K8S_NAMESPACE:default}
  image-pull-secret: ${K8S_IMAGE_PULL_SECRET:ncp-cr}

kaniko:
  image: ${KANIKO_IMAGE:gcr.io/kaniko-project/executor:latest}

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL:}

deployment:
  domain:
    suffix: ${DEPLOYMENT_DOMAIN_SUFFIX:klepaas.io}
  pipeline:
    poll-initial-interval: 10000
    poll-max-interval: 60000
    build-timeout: 1800000

gemini:
  api:
    base-url: https://generativelanguage.googleapis.com
    key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-2.5-flash}

# 자연어 명령 해석 모델 (#136). provider: gemini · anthropic · openai · openai-compatible(#150, base-url의 OpenAI 호환 서버, 키 없음). 기본값은 #58 비교로 정했다 (스펙 0058·0136).
# gemini.api.model(GEMINI_MODEL)은 자연어 명령에서 쓰지 않는다. gemini로 되돌릴 때는 NLP_LLM_MODEL에 모델을 준다
nlp:
  llm:
    provider: ${NLP_LLM_PROVIDER:openai}
    model: ${NLP_LLM_MODEL:gpt-6-luna}
    base-url: ${NLP_LLM_BASE_URL:}

# AI 진단 모델 (#100). provider: gemini · anthropic · openai · openai-compatible(#150). 키는 GEMINI_API_KEY · ANTHROPIC_API_KEY · OPENAI_API_KEY(선택한 공급사만).
# 기본값은 #99 사례 비교 결과로 정했다 (스펙 0100). 자연어 명령은 nlp.llm을 쓴다
diagnosis:
  llm:
    provider: ${DIAGNOSIS_LLM_PROVIDER:openai}
    model: ${DIAGNOSIS_LLM_MODEL:gpt-6-luna}
    # openai-compatible일 때 필수. /v1까지 포함 (예: Ollama http://localhost:11434/v1)
    base-url: ${DIAGNOSIS_LLM_BASE_URL:}
    # OpenAI reasoning_effort (#115). 비우면 모델 기본값. none·low는 #99 품질 기준을 넘지 못해 기본값을 둔다 (스펙 0115)
    reasoning-effort: ${DIAGNOSIS_LLM_REASONING_EFFORT:}
  # 운영문서·확정 사건 검색 (#104). 임베딩은 OPENAI_API_KEY를 쓰고, 키가 없으면 지식 없이 진단한다 (스펙 0104)
  rag:
    # 진단에 지식을 넣을지 (#129). #123 독립 평가에서 개선이 없고 비용만 14~24% 늘어 기본으로 끈다.
    # 로그만으로 원인을 알 수 없는 실제 사례가 쌓이면 다시 측정하고 켠다. 꺼져도 문서·사건 저장과 API는 동작한다
    enabled: ${DIAGNOSIS_RAG_ENABLED:false}
  # 관측 시그니처 규칙이 원인을 정하면 모델을 부르지 않는다 (#170). #168 동결 평가 세트에서 규칙 우선의 채택 조건을 충족했다.
  # 끄면 모든 진단이 모델 경로다. 규칙 판정이 의심되면 끄고 재기동한다
  rule-first:
    enabled: ${DIAGNOSIS_RULE_FIRST_ENABLED:true}
    embedding-model: ${DIAGNOSIS_RAG_EMBEDDING_MODEL:text-embedding-3-small}
    top-k: ${DIAGNOSIS_RAG_TOP_K:4}
    # RAG 평가에서 관련 지식은 0.5 이상, 관계없는 문서는 0.39였다
    min-similarity: ${DIAGNOSIS_RAG_MIN_SIMILARITY:0.45}

# LLM 사용 예산 (#176). 사용자별 하루(한국 시간 자정 기준) 계산 비용 상한(USD). 0이면 상한 없음.
# 넘으면 진단은 규칙이 정하지 못한 경우 모델 없이 판단 보류, 자연어 명령은 429 AI_007. 가격표는 llm/pricing.json
llm:
  budget:
    daily-usd-per-user: ${LLM_BUDGET_DAILY_USD_PER_USER:1.0}

# 지표 (#174). 관리 포트를 따로 두고 127.0.0.1에만 연다. 앱 포트·공개 경로에는 /actuator가 없다.
# 노출 엔드포인트는 prometheus 하나. 지표 목록은 docs/observability.md
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    distribution:
      percentiles-histogram:
        klepaas.llm.latency: true
