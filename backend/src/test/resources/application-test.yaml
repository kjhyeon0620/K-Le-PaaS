spring:
  main:
    allow-bean-definition-overriding: true
  # datasource는 PostgresTestDatabase(Testcontainers)가 컨텍스트마다 새 데이터베이스로 채운다.
  jpa:
    hibernate:
      ddl-auto: validate

app:
  version: 0.0.1-SNAPSHOT

jwt:
  secret: test-jwt-secret-must-be-at-least-thirty-two-bytes
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

github:
  client-id: test-client-id
  client-secret: test-client-secret
  app:
    app-id: 12345
    private-key: test-key
    app-slug: test-app

gemini:
  api:
    base-url: https://example.test
    key: test-gemini-api-key

cloud:
  ncp:
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    region: ap-northeast-2
    storage:
      endpoint: https://example.test
      bucket: test-bucket
    container-registry:
      endpoint: test-registry.example.test

slack:
  webhook:
    url:
